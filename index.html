<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>linktree</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="gustavo.png">
  </head>
  <body>
    <div class="card">
      <img src="gustavo.png" alt="Sua Foto" class="profile-img" />
      <h1>Gustavo Designer</h1>
      <p class="tagline">Designer Gráfico • Identidade Visual • Social Media</p>

      <div class="links">
        <a
          href="https://wa.me/67991759446"
          target="_blank"
          class="link-button whatsapp"
          >📱 Falar no WhatsApp</a
        >
        <a
          href="https://www.instagram.com/Gustavodesign00/"
          target="_blank"
          class="link-button instagram"
          >📷 Ver no Instagram</a
        >
      </div>

      <div class="bio">
        <p>
          Artes para feed, stories, banners e vídeos Pedidos e orçamentos por
          aqui mesmo! Entre em contato para seu design personalizado!
        </p>
      </div>
    </div>
  </body>
</html>
